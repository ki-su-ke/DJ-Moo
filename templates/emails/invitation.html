<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>組織招待</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2 style="color: #333;">{{ organization_name }} からの招待</h2>
        <p>あなたは {{ organization_name }} に招待されました。</p>
        
        <div style="margin: 20px 0;">
            <a href="{{ accept_url }}" style="display: inline-block; padding: 12px 24px; background-color: #28a745; color: white; text-decoration: none; border-radius: 4px; margin-right: 10px;">
                招待を承認する
            </a>
            <a href="{{ decline_url }}" style="display: inline-block; padding: 12px 24px; background-color: #dc3545; color: white; text-decoration: none; border-radius: 4px;">
                招待を拒否する
            </a>
        </div>
        
        <p style="font-size: 12px; color: #666;">
            この招待は7日間有効です。<br>
            もしこの招待にお心当たりがない場合は、このメールを無視してください。
        </p>
        
        <p style="font-size: 12px; color: #999;">
            または、以下のURLをブラウザにコピーして貼り付けてください：<br>
            承認: <a href="{{ accept_url }}" style="color: #28a745;">{{ accept_url }}</a><br>
            拒否: <a href="{{ decline_url }}" style="color: #dc3545;">{{ decline_url }}</a>
        </p>
    </div>
</body>
</html>
