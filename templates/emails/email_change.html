<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メールアドレス変更</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2 style="color: #333;">メールアドレス変更</h2>
        <p>メールアドレス変更リクエストを受け付けました。</p>
        
        <p>
            <strong>現在のメールアドレス:</strong> {{ current_email }}<br>
            <strong>新しいメールアドレス:</strong> {{ new_email }}
        </p>
        
        <div style="margin: 20px 0;">
            <a href="{{ change_url }}" style="display: inline-block; padding: 12px 24px; background-color: #28a745; color: white; text-decoration: none; border-radius: 4px;">
                メールアドレスを変更する
            </a>
        </div>
        
        <p style="font-size: 12px; color: #666;">
            このURLは1時間有効です。<br>
            もしメールアドレス変更をリクエストしていない場合は、このメールを無視してください。
        </p>
        
        <p style="font-size: 12px; color: #999;">
            または、以下のURLをブラウザにコピーして貼り付けてください：<br>
            <a href="{{ change_url }}" style="color: #28a745;">{{ change_url }}</a>
        </p>
    </div>
</body>
</html>
